# ============================================================
# RabbitMQ Configuration
# ============================================================

# Default user/vhost (set in docker-compose via env vars)
# These values are overridden by RABBITMQ_DEFAULT_USER/PASS

# Enable management plugin (included in management image)
# management.rates_mode = basic

# Heartbeat interval (seconds)
heartbeat = 60

# Message size limit (50MB)
max_message_size = 52428800

# Consumer timeout (disable for long-running consumers)
# consumer_timeout = false

# Logging
log.console = true
log.console.level = info
