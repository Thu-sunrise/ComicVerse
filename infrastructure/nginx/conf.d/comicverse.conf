# ============================================================
# ComicVerse — Nginx Virtual Host Configuration
# Reverse proxy to API Gateway
# ============================================================

upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                   always;
    add_header X-Frame-Options          "DENY"                      always;
    add_header X-XSS-Protection         "1; mode=block"             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # -------------------------------------------------------
    # Request ID — generate if not present, forward to gateway
    # -------------------------------------------------------
    set $request_id_val $http_x_request_id;
    if ($request_id_val = "") {
        set $request_id_val $request_id;
    }
    add_header X-Request-ID $request_id_val always;

    # -------------------------------------------------------
    # Health check for Nginx itself (used by load balancer)
    # -------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 '{"status":"UP","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # -------------------------------------------------------
    # Proxy all API traffic to API Gateway
    # -------------------------------------------------------
    location / {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;

        # Forward headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id_val;
        proxy_set_header   X-Correlation-ID  $http_x_correlation_id;

        # WebSocket support (for Ably upgrade path if needed)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Buffer settings
        proxy_buffering    off;
        proxy_buffer_size  4k;
    }

    # -------------------------------------------------------
    # Error pages
    # -------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
