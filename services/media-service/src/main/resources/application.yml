server:
  port: 8090
spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DATABASE_URL:jdbc:postgresql://localhost:5432/media_db}
    username: ${MEDIA_DATABASE_USERNAME:postgres}
    password: ${MEDIA_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
gateway:
  secret: ${GATEWAY_SECRET:dev-gateway-secret}
management:
  endpoints:
    web:
      exposure:
        include: health,info
