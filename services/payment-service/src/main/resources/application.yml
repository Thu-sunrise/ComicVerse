server:
  port: 8085
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DATABASE_USERNAME:postgres}
    password: ${PAYMENT_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
gateway:
  secret: ${GATEWAY_SECRET:dev-gateway-secret}
management:
  endpoints:
    web:
      exposure:
        include: health,info
