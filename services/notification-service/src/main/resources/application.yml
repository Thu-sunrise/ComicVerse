server:
  port: 8088
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DATABASE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DATABASE_USERNAME:postgres}
    password: ${NOTIFICATION_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
gateway:
  secret: ${GATEWAY_SECRET:dev-gateway-secret}

# ============================================================
# Firebase Cloud Messaging (FCM)
# NEVER commit service account credentials to Git.
# ============================================================
fcm:
  # Path to Firebase service account JSON file
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  # OR base64-encoded JSON (alternative if file mount not available)
  service-account-json-base64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:}
  # Firebase project ID
  project-id: ${FCM_PROJECT_ID:comicverse-app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.comicverse: DEBUG
