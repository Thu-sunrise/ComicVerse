server:
  port: 8087
spring:
  application:
    name: chat-service
  datasource:
    url: ${CHAT_DATABASE_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${CHAT_DATABASE_USERNAME:postgres}
    password: ${CHAT_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
gateway:
  secret: ${GATEWAY_SECRET:dev-gateway-secret}

# ============================================================
# Ably — Realtime Transport
# NEVER expose this key to the frontend.
# Frontend obtains a token from GET /api/v1/realtime/token
# ============================================================
ably:
  api-key: ${ABLY_API_KEY:}
  # Token TTL in seconds (1 hour)
  token-ttl: 3600
  # Channel prefix pattern: chat:room:{roomId}
  channel-prefix: "chat:room:"

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.comicverse: DEBUG
