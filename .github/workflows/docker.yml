name: Docker Container Build Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-containers:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Shared Module
        run: |
          cd services/shared
          mvn clean install -DskipTests

      - name: Set Git SHA Tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Microservice Container Images
        run: |
          for service in api-gateway auth-service story-service sync-service user-service payment-service recommendation-service chat-service notification-service search-service media-service; do
            echo "=========================================="
            echo "Building Docker image for ${service}:${{ steps.vars.outputs.sha_short }}"
            echo "=========================================="
            docker build -t "comicverse/${service}:${{ steps.vars.outputs.sha_short }}" -t "comicverse/${service}:latest" "services/${service}"
          done
