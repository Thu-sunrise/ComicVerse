name: ComicVerse CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    name: Backend Microservices CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Shared Module
        run: |
          cd services/shared
          mvn clean install -DskipTests

      - name: Run Unit Tests Across All Microservices
        run: |
          for dir in services/*/; do
            if [ -f "${dir}pom.xml" ]; then
              echo "=========================================="
              echo "Running unit tests in ${dir}"
              echo "=========================================="
              (cd "${dir}" && mvn clean test)
            fi
          done

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f infrastructure/dev/docker-compose.yml config > /dev/null
          echo "✅ Docker Compose configuration is valid."

  web-ci:
    name: Frontend Web (Reader + Admin) CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9.x'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests (Zero DB)
        run: pnpm test

      - name: Build Web Reader
        run: pnpm build:reader

      - name: Build Web Admin
        run: pnpm build:admin
